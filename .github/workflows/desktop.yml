name: Desktop build

# Exports the Godot desktop port (desktop/) for Windows and Linux with the
# official Godot export templates, packs the card images per collection and,
# for a desktop-v* tag or a manual run with a version, publishes a GitHub release with both builds.

on:
  push:
    branches: [desktop-port]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 2.0.0); empty builds only"
        required: false
        default: ""

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir" && unzip -q templates.tpz && mv templates/* "$dir/"
          godot --version

      - name: Import assets
        run: godot --headless --path desktop --import

      - name: Copy game data into the project
        run: godot --headless --path desktop --script res://tools/sync_content.gd

      - name: Tests
        run: godot --headless --path desktop --script res://tests/run_tests.gd

      - name: Export Windows and Linux
        run: |
          mkdir -p desktop/build/windows desktop/build/linux
          godot --headless --path desktop --export-release Windows build/windows/IdleCardShop.exe
          godot --headless --path desktop --export-release Linux build/linux/IdleCardShop.x86_64
          godot --headless --path desktop --export-pack Windows build/game.pck
          test -f desktop/build/windows/IdleCardShop.exe && test -f desktop/build/linux/IdleCardShop.x86_64 && test -f desktop/build/game.pck

      - name: Card packs
        run: |
          mkdir -p packs
          for d in images/*/; do
            id=$(basename "$d")
            grep -q "\"$id.json\"" collections.json || continue
            godot --headless --path desktop --script res://tools/pack_cards.gd -- "$PWD/$d" "$id" "$PWD/packs/cards-$id.pck"
          done
          ls -la packs

      - name: Update manifest
        # The launcher (desktop/scripts/boot.gd) reads manifest.json from the
        # latest release and downloads only the files whose checksum changed.
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''):
                      h.update(b)
              return h.hexdigest()
          version = re.search(r'config/version="([^"]+)"', open('desktop/project.godot').read()).group(1)
          packs = []
          for f in sorted(os.listdir('packs')):
              cid = f[len('cards-'):-len('.pck')]
              name = json.load(open(cid + '.json', encoding='utf-8')).get('name', cid)
              packs.append({'file': f, 'name': name, 'sha256': sha('packs/' + f), 'size': os.path.getsize('packs/' + f)})
          g = 'desktop/build/game.pck'
          m = {'version': version, 'engine': os.environ['GODOT_VERSION'],
               'game': {'file': 'game.pck', 'sha256': sha(g), 'size': os.path.getsize(g)}, 'packs': packs}
          os.makedirs('dist', exist_ok=True)
          json.dump(m, open('dist/manifest.json', 'w'), indent=1)
          print(version, len(packs), 'packs')
          PY

      - name: Zip
        run: |
          for os in windows linux; do
            mkdir -p "dist/IdleCardShop" && rm -rf dist/IdleCardShop/*
            cp desktop/build/$os/* dist/IdleCardShop/
            cp -r packs dist/IdleCardShop/packs
            (cd dist && zip -q -r "IdleCardShop-$os.zip" IdleCardShop)
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release == '' }}
        with:
          name: IdleCardShop-desktop
          path: |
            dist/*.zip
            dist/manifest.json
          retention-days: 7
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ -n "$VERSION" ]; then tag="desktop-v$VERSION"; fi
          gh release create "$tag" dist/IdleCardShop-windows.zip dist/IdleCardShop-linux.zip \
            dist/manifest.json desktop/build/game.pck packs/*.pck \
            --target "$GITHUB_SHA" --title "IdleCardShop desktop ${tag#desktop-v}" --notes-file desktop/RELEASE_NOTES.md
